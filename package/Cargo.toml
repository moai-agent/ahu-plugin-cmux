[package]
name = "ahu-cmux-session-host-plugin"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "cmux session host for Ahu executable plugins"
publish = false

[[bin]]
name = "session-host"
path = "src/main.rs"

[dependencies]
serde = "1"
serde_json = "1"
sha2 = "0.10"
libc = "0.2"

[[example]]
name = "fixture-host"
path = "../tests/fixture_host.rs"
