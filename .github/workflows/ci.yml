name: Rust plugin checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      CARGO_TARGET_DIR: ${{ runner.temp }}/plugin-target
      PYTHONDONTWRITEBYTECODE: '1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install --no-self-update
      - name: Check Rust and independent protocol fixtures
        run: |
          cargo fmt --manifest-path package/Cargo.toml --all --check
          cargo clippy --manifest-path package/Cargo.toml --all-targets --locked -- -D warnings
          cargo test --manifest-path package/Cargo.toml --locked
          cargo build --manifest-path package/Cargo.toml --bins --examples --locked
          python3 -m unittest discover -s tests -v
      - name: Build production host
        run: cargo build --manifest-path package/Cargo.toml --release --locked --bin session-host
